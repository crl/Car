name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: cheguanzhang-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cheguanzhang-*
          path: release-assets
          merge-multiple: true
      - name: Publish v0.1.0 installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t installers < <(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' \))
          test "${#installers[@]}" -eq 3
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 "${installers[@]}" --clobber
          else
            gh release create v0.1.0 "${installers[@]}" --target "$GITHUB_SHA" --title '运管家 v0.1.0' --notes-file RELEASE_NOTES.md
          fi

[package]
name = "cheguanzhang"
version = "0.1.9"
description = "运管家 — 本地车辆收支管理"
authors = ["crl"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
chrono = "0.4"
tempfile = "3"
rust_xlsxwriter = "0.93"
calamine = "0.38"
tauri-plugin-updater = "2"
pinyin = "0.11"
sha2 = "0.10"
subtle = "2"
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
getrandom = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
if-addrs = "0.15"
rcgen = { version = "0.14", default-features = false, features = ["ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
zip = { version = "4", default-features = false, features = ["deflate"] }

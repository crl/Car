<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汽车内账</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><div class="shell"><aside><a class="brand" href="/">▣ 汽车内账</a><p class="nav-caption">工作空间</p><nav><a href="/cars">▦ 车辆管理</a><a href="/entries">▤ 收支账目</a><a href="/categories">◷ 收支类型</a><a href="/addresses">⌖ 地址管理</a></nav><div class="aside-note">本地账本<br><small>每一笔收支，清楚有据</small></div></aside><div class="workspace"><header><div><p class="eyebrow">VEHICLE LEDGER</p><h1 id="pageTitle">车辆与账目</h1><small>清晰记录每台车的收入与支出</small></div><div class="header-actions"><button class="secondary" onclick="carForm()">＋ 新增车辆</button><button onclick="entryForm()">＋ 记一笔账</button></div></header><main><p id="message" role="status"></p><div class="stats" id="stats"></div><section id="ledger-section"><div class="toolbar"><h2>收支明细</h2><span class="section-note">按车辆和日期查询</span><select id="filter" onchange="render()"><option value="">全部车辆</option></select><input id="start" type="date" aria-label="开始日期" onchange="render()"><span>至</span><input id="end" type="date" aria-label="结束日期" onchange="render()"><button class="text-button" onclick="clearFilters()">清空筛选</button><a class="link secondary" href="/api/export" download="汽车账目.xlsx">导出全部账目</a></div><p class="muted" id="subtotal"></p><div class="scroll"><table><thead><tr><th>日期</th><th>车辆</th><th>收支</th><th>项目</th><th>金额</th><th>起点 → 终点</th><th>往来方 / 备注</th></tr></thead><tbody id="entries"></tbody></table></div><p class="muted">收支差额按实际录入的收入减支出计算，不代表会计利润。</p></section><section><div class="toolbar"><h2>车辆档案</h2><input id="search" placeholder="搜索车牌、车型、车架号" oninput="render()"></div><div class="scroll"><table><thead><tr><th>车牌</th><th>车架号</th><th>收入</th><th>支出</th><th>收支差额</th><th>操作</th></tr></thead><tbody id="cars"></tbody></table></div></section></main></div></div><dialog id="modal"><form id="form" novalidate><div class="modal-head"><h2 id="title"></h2><button type="button" class="icon-button" aria-label="关闭表单" onclick="requestClose()">×</button></div><div class="modal-body"><div id="fields"></div><p id="error" role="alert"></p></div><div class="modal-footer row"><button class="secondary" type="button" onclick="requestClose()">取消</button><button id="save">保存</button></div></form></dialog><dialog id="regionModal" aria-labelledby="regionTitle"><div class="modal-head"><h2 id="regionTitle">选择行政区划</h2><button class="icon-button" type="button" onclick="closeRegion()" aria-label="关闭地区选择">×</button></div><div class="region-body"><p class="help">基础库：2023-06-30 · 大陆31省级地区，不含港澳台</p><label>搜索全国地区<input id="regionSearch" placeholder="如：浙江 杭州 余杭" oninput="searchRegions()"></label><div id="regionTrail" class="region-trail"></div><div id="regionItems" class="region-items"></div><p id="regionError" role="alert"></p></div><div class="modal-footer row"><button class="secondary" onclick="closeRegion()">取消</button><button id="regionConfirm" onclick="confirmRegion()" disabled>使用此地区</button></div></dialog><div id="toast" role="status" aria-live="polite"></div></body></html>
